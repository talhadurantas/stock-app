name: Portfolio tests

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read

jobs:
  test:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
        env:
          MPLBACKEND: Agg

  live:
    name: Streamlit browser check
    if: github.event.action != 'closed' || github.event.pull_request.merged
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.action == 'closed' && github.event.pull_request.merge_commit_sha || github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt playwright==1.56.0
      - run: python -m playwright install --with-deps chromium
      - name: Start the app with fixture prices for pull request checks
        if: github.event.action != 'closed'
        run: |
          PYTHONPATH=. python -m streamlit run tests/browser_app.py --server.headless true --server.port 8501 > "$RUNNER_TEMP/portfolio-streamlit.log" 2>&1 &
          curl --fail --silent --show-error --retry 20 --retry-delay 1 --retry-connrefused http://localhost:8501/_stcore/health
      - run: python tests/smoke_release.py
        env:
          PYTHONPATH: .
          MPLBACKEND: Agg
          PORTFOLIO_APP_URL: ${{ github.event.action != 'closed' && 'http://localhost:8501' || 'https://stock-app-drkienpnjsbecpxcxo3ina.streamlit.app/' }}
